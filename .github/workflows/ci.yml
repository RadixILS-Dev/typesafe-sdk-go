name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26.x is the module's minimum supported version (see go.mod);
        # stable tracks the newest release.
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          # git status tolerates a missing go.sum (this module has no dependencies).
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum changed after 'go mod tidy'; commit the result"
            git status --porcelain go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build library and examples
        run: go build ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test
        run: go test -race -cover ./...

  release-version:
    name: Release tag matches Version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with the Version constant
        run: |
          tag="${GITHUB_REF_NAME}"
          const="$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' config.go | head -1)"
          echo "tag=$tag Version=$const"
          if [ "v$const" != "$tag" ]; then
            echo "::error::tag $tag does not match Version \"$const\" in config.go; keep them in step when tagging"
            exit 1
          fi
